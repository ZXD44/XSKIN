<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="blurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7289da"/>
      <stop offset="100%" stop-color="#5865f2"/>
    </linearGradient>
    <linearGradient id="darkPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2d31"/>
      <stop offset="100%" stop-color="#18191c"/>
    </linearGradient>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865f2"/>
      <stop offset="100%" stop-color="#232428"/>
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5865f2" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Squircle Container (Discord App Icon Style) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#1e1f22" stroke="#2b2d31" stroke-width="1.5"/>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#111215"/>

  <!-- Subtle Discord Blurple Inner Aura -->
  <circle cx="32" cy="32" r="22" fill="#5865f2" opacity="0.12"/>

  <!-- Left Cyber Horn -->
  <path d="M14 12 L24 22 L20 25 L10 16 Z" fill="url(#hornGrad)"/>
  <path d="M14 12 L18 8 L24 22 Z" fill="#7289da"/>

  <!-- Right Cyber Horn -->
  <path d="M50 12 L40 22 L44 25 L54 16 Z" fill="url(#hornGrad)"/>
  <path d="M50 12 L46 8 L40 22 Z" fill="#7289da"/>

  <!-- Dragon Crown Crest / Center Spike -->
  <polygon points="32,10 37,20 32,24 27,20" fill="url(#blurpleGrad)"/>
  <polygon points="32,12 35,19 32,22 29,19" fill="#00e5ff" opacity="0.85"/>

  <!-- Upper Brow / Head Armor Plate -->
  <polygon points="18,24 46,24 50,32 32,38 14,32" fill="url(#darkPlate)" stroke="#5865f2" stroke-width="0.8"/>

  <!-- Forehead Accent Crest Plate -->
  <polygon points="26,22 38,22 35,29 29,29" fill="#5865f2"/>

  <!-- Glowing Cyber Eyes (Discord Online Emerald + Cyan Spark) -->
  <!-- Left Eye -->
  <polygon points="21,30 28,31 26,34 20,33" fill="#23a55a" filter="url(#cyberGlow)"/>
  <polygon points="22,31 27,31.5 25,33 21,32.5" fill="#57f287"/>
  <circle cx="24" cy="32" r="0.8" fill="#ffffff"/>

  <!-- Right Eye -->
  <polygon points="43,30 36,31 38,34 44,33" fill="#23a55a" filter="url(#cyberGlow)"/>
  <polygon points="42,31 37,31.5 39,33 43,32.5" fill="#57f287"/>
  <circle cx="40" cy="32" r="0.8" fill="#ffffff"/>

  <!-- Dragon Snout & Nose Ridge -->
  <polygon points="28,35 36,35 38,45 32,49 26,45" fill="#18191c" stroke="#35373c" stroke-width="0.8"/>
  <polygon points="30,36 34,36 35,44 32,47 29,44" fill="#2b2d31"/>

  <!-- Cyber Cheek Plates -->
  <polygon points="14,34 22,36 21,43 13,38" fill="#232428"/>
  <polygon points="50,34 42,36 43,43 51,38" fill="#232428"/>

  <!-- Nostril Glow Vent -->
  <rect x="29" y="44" width="2" height="2" rx="0.5" fill="#5865f2"/>
  <rect x="33" y="44" width="2" height="2" rx="0.5" fill="#5865f2"/>

  <!-- Sharp Cyber Fangs -->
  <polygon points="27,46 29,46 28,51" fill="#ffffff"/>
  <polygon points="35,46 37,46 36,51" fill="#ffffff"/>

  <!-- Lower Jaw Plate -->
  <polygon points="28,48 36,48 34,53 30,53" fill="#111215" stroke="#5865f2" stroke-width="0.6"/>

  <!-- Core Zircon Crystal Accent (Forehead Diamond) -->
  <polygon points="32,24 34.5,27.5 32,31 29.5,27.5" fill="#00e5ff"/>
  <polygon points="32,25 33.5,27.5 32,30 30.5,27.5" fill="#ffffff" opacity="0.85"/>
</svg>
