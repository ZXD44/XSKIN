<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;}
body{display:grid;place-items:center;background:radial-gradient(60% 70% at 50% 45%, #1a2140 0%, #0a0d1a 60%, #05060d 100%);}
.frame{position:relative;width:520px;height:560px;display:grid;place-items:center;}
.rings{position:absolute;inset:0;display:grid;place-items:center;}
.rings span{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.rings span:nth-child(1){width:200px;height:200px}
.rings span:nth-child(2){width:330px;height:330px;border-style:dashed;border-color:rgba(255,255,255,.06)}
.rings span:nth-child(3){width:460px;height:460px;border-color:rgba(255,255,255,.04)}
img{position:relative;height:420px;width:auto;object-fit:contain;filter:drop-shadow(0 24px 40px rgba(0,0,0,.55));}
</style></head><body><div class="frame"><div class="rings"><span></span><span></span><span></span></div><img src="../public/showcase/character.svg"></div></body></html>
