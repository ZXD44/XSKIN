<!DOCTYPE html>

  .tile.sm{width:34px;height:34px;border-radius:10px}
  .tile.xs{width:26px;height:26px;border-radius:8px}
  svg{display:block}
  .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#59618a;margin-bottom:10px}
